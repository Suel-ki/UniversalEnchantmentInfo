plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

def emi_available = emi_enabled == "true" && project.findProperty("${project.name}_emi_enabled") == "true"
def jei_available = jei_enabled == "true" && project.findProperty("${project.name}_jei_enabled") == "true"
def rei_available = rei_enabled == "true" && project.findProperty("${project.name}_rei_enabled") == "true"

loom {
    // accessWidenerPath = project(":common").loom.accessWidenerPath
}

base {
    archivesName = "UniversalEnchantmentInfo" + "-" + minecraft_version + "-neoforge"
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        name = "NeoForge Maven"
        url = "https://maven.neoforged.net/releases/"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    if (emi_available) {
        common(project(path: ":common-emi")) { transitive false }
        shadowCommon(project(path: ":common-emi", configuration: "transformProductionNeoForge")) { transitive = false }
    }
    if (jei_available) {
        common(project(path: ":common-jei")) { transitive false }
        shadowCommon(project(path: ":common-jei", configuration: "transformProductionNeoForge")) { transitive = false }
    }
    if (rei_available) {
        common(project(path: ":common-rei")) { transitive false }
        shadowCommon(project(path: ":common-rei", configuration: "transformProductionNeoForge")) { transitive = false }
    }
}

processResources {
    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand project.ext.expandProps
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

jar {
    archiveClassifier = "raw"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    repositories {
    }
}

publishMods {
    file = tasks.shadowJar.archiveFile
    displayName = "[NeoForge ${project.minecraft_version}] v${project.version}"
    changelog = rootProject.file("docs/CHANGELOGS.md").exists()
        ? rootProject.file("docs/CHANGELOGS.md").text
        : ""
    type = STABLE
    modLoaders.add("neoforge")

    curseforge {
        projectId = "1630244"
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        client = true
        minecraftVersions.add(project.minecraft_version)
        optional("jei")
        optional("emi")
        optional("roughly-enough-items")
    }

    modrinth {
        projectId = "c39iXKSf"
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        environment = CLIENT_ONLY
        minecraftVersions.add(project.minecraft_version)
        optional("jei")
        optional("emi")
        optional("rei")
    }
}
