modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL="https://github.com/Suel-ki/UniversalEnchantmentInfo/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${mod_description}'''
logoFile = "logo.png"
displayURL="https://github.com/Suel-ki/UniversalEnchantmentInfo"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange = "${neoforge_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="${jei_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="rei"
type="optional"
versionRange="${rei_version_range}"
ordering="AFTER"
side="BOTH"

