pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

include("common")

if (settings.emi_enabled == "true") {
    include("common-emi")
}
if (settings.jei_enabled == "true") {
    include("common-jei")
}
if (settings.rei_enabled == "true") {
    include("common-rei")
}

include("fabric")
include("neoforge")

rootProject.name = "UniversalEnchantmentInfo"
