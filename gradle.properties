org.gradle.jvmargs=-Xmx3G

# Stonecutter 0.10 requires a Java 25+ daemon; set org.gradle.java.home in
# ~/.gradle/gradle.properties to point at the toolchain you want to use.
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Version of the Fabric Loom plugin used by `loom-back-compat`.
# This has to be a Gradle property, because it is read before Stonecutter
# gets a chance to export the structured properties to the project.
loomx.loom_version=1.18-SNAPSHOT
