modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"
issueTrackerURL="https://github.com/Suel-ki/UniversalEnchantmentInfo/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${mod_description}'''
logoFile = "logo.png"
displayURL="https://github.com/Suel-ki/UniversalEnchantmentInfo"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId="emi"
mandatory=false
versionRange="${emi_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="${jei_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="rei"
mandatory=false
versionRange="${rei_version_range}"
ordering="AFTER"
side="BOTH"
