architectury {
    common(enabled_platforms.split(","))
}

loom {
    mixin {
        defaultRefmapName = "uei-rrv-refmap.json"
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    compileOnly project(path: ":common")
    compileOnlyApi "cc.cassian.rrv:reliable-recipe-viewer-neoforge:${rrv_version}+${minecraft_version}"
}
