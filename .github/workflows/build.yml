name: Build & Draft Release

on:
  push:
    branches: [main, "1.20.1"]
    tags: ["v*"]
  pull_request:
    branches: [main, "1.20.1"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mc_version: ${{ steps.config.outputs.mc_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect config
        id: config
        run: |
          JAVA=$(grep '^java_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "java_version=$JAVA" >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "${{ steps.config.outputs.java_version }}"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build & Test
        run: chmod +x gradlew && ./gradlew build

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "v${{ needs.build.outputs.mc_version }}-${{ inputs.version }}"
          git push origin "v${{ needs.build.outputs.mc_version }}-${{ inputs.version }}"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all --tag-pattern "v${{ needs.build.outputs.mc_version }}-.*"
        env:
          OUTPUT: CHANGELOG.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: CHANGELOG.md
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}-{1}', needs.build.outputs.mc_version, inputs.version) || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
