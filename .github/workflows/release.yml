name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect platform from tag
        id: config
        run: |
          # Read from the tagged code, not the default branch
          git checkout "${{ github.ref_name }}"

          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          JAVA=$(grep '^java_version=' gradle.properties | cut -d= -f2)
          MC_MAJOR=$(echo "$MC" | cut -d. -f1)
          MC_MINOR=$(echo "$MC" | cut -d. -f2)

          echo "mc_version=$MC" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA" >> "$GITHUB_OUTPUT"

          if [ "$MC_MAJOR" -gt 1 ] || [ "$MC_MINOR" -ge 21 ]; then
            echo "loader=neoforge" >> "$GITHUB_OUTPUT"
          else
            echo "loader=forge" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "${{ steps.config.outputs.java_version }}"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: chmod +x gradlew && ./gradlew build

      - name: Upload jars to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            fabric/build/libs/*-fabric-[0-9]*[0-9].jar \
            ${{ steps.config.outputs.loader }}/build/libs/*-${{ steps.config.outputs.loader }}-[0-9]*[0-9].jar

      - name: Save changelog for publish
        run: |
          cat << 'EOF' > docs/CHANGELOGS.md
          ${{ github.event.release.body }}
          EOF

      - name: Publish to CurseForge & Modrinth
        run: ./gradlew publish
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}

      - name: Update changelog
        run: |
          TAG="${{ github.ref_name }}"
          MC="${{ steps.config.outputs.mc_version }}"
          BRANCH="$MC"

          git fetch origin "$BRANCH"
          git checkout -f "$BRANCH"

          mkdir -p docs
          CHANGELOG_FILE="docs/CHANGELOGS.md"
          echo "" >> "$CHANGELOG_FILE"
          cat << 'EOF' >> "$CHANGELOG_FILE"
          ${{ github.event.release.body }}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH="changelog-update-$BRANCH"
          git checkout -B "$PR_BRANCH"
          git add "$CHANGELOG_FILE"
          git diff --staged --quiet && exit 0
          git commit -m "chore: update changelog for $TAG"
          git push -f origin "$PR_BRANCH"

          gh pr create \
            --title "docs: update changelog for $TAG" \
            --body "Automated changelog update for \`$TAG\`." \
            --base "$BRANCH" \
            --head "$PR_BRANCH" \
            || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
