name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: chmod +x gradlew && ./gradlew build

      - name: Upload jars to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            fabric/build/libs/*-fabric-[0-9]*[0-9].jar \
            forge/build/libs/*-forge-[0-9]*[0-9].jar

      - name: Save changelog for publish
        run: |
          cat << 'EOF' > docs/CHANGELOGS.md
          ${{ github.event.release.body }}
          EOF

      - name: Publish to CurseForge & Modrinth
        run: ./gradlew publish
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}

      - name: Update changelog
        run: |
          TAG="${{ github.ref_name }}"
          BRANCH=$(echo "$TAG" | grep -oP 'v\K\d+\.\d+\.\d+(?=-)')
          BRANCH="${BRANCH:-1.20.1}"

          git fetch origin "$BRANCH"
          git checkout -f "$BRANCH"

          mkdir -p docs
          CHANGELOG_FILE="docs/CHANGELOGS.md"
          echo "" >> "$CHANGELOG_FILE"
          cat << 'EOF' >> "$CHANGELOG_FILE"
          ${{ github.event.release.body }}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PR_BRANCH="changelog-update-$TAG"
          git checkout -b "$PR_BRANCH"
          git add "$CHANGELOG_FILE"
          git diff --staged --quiet && exit 0
          git commit -m "chore: update changelog for $TAG"
          git push origin "$PR_BRANCH"

          gh pr create \
            --title "docs: update changelog for $TAG" \
            --body "Automated changelog update for \`$TAG\`." \
            --base "$BRANCH" \
            --head "$PR_BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
